<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 - 順路眼</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9800">
    <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
    <div class="app-container">
        <div class="login-view">
            <div class="login-header">
                <div class="logo-circle">👁️</div>
                <h1>404</h1>
                <p style="color: #888; font-size: 0.95rem; margin-top: 10px;">找不到您請求的頁面</p>
            </div>
            <div class="login-body">
                <button type="button" class="login-main-btn" id="action-btn">返回登入頁</button>
            </div>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loggedIn = loadCurrentUser();
            const btn = document.getElementById('action-btn');
            if (loggedIn) {
                btn.innerText = '前往地圖大廳';
                btn.onclick = () => location.href = 'app.html';
            } else {
                btn.innerText = '返回登入頁';
                btn.onclick = () => location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
