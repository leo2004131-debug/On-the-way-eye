<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>順路眼 - 點數錢包</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <a id="top-left-avatar-btn" href="profile.html" aria-label="個人中心"><span>👤</span></a>
            <h1>點數錢包</h1>
        </header>

        <!-- 3.0 點數錢包 -->
        <main>
            <div class="wallet-card">
                <div class="wallet-label">當前餘額 (Points)</div>
                <div class="wallet-balance"><span id="wallet-balance-val">0</span><span>點</span></div>
            </div>

            <div class="section-title">快速儲值</div>
            <div class="topup-grid">
                <button type="button" class="topup-btn" onclick="addPoints(100)">+ 100 點</button>
                <button type="button" class="topup-btn" onclick="addPoints(500)">+ 500 點</button>
                <button type="button" class="topup-btn" onclick="addPoints(1000)">+ 1000 點</button>
            </div>

            <div class="wallet-transaction-header">
                <strong>交易紀錄</strong>
                <a href="history.html">更多 <span style="font-size: 10px; color: #b5b5b5;">▶</span></a>
            </div>
            <div id="transaction-list" class="transaction-list"></div>

            <div class="section-title">全家點數商城</div>
            <div class="points-shop">
                <div class="product-card">☕<div>全家大美式</div><div class="product-price">450點</div><button type="button" class="exchange-btn" onclick="exchangeProduct('全家大美式', 450)">立即兌換</button></div>
                <div class="product-card">💳<div>全家50元卡</div><div class="product-price">500點</div><button type="button" class="exchange-btn" onclick="exchangeProduct('全家50元卡', 500)">立即兌換</button></div>
                <div class="product-card">💳<div>全家100元卡</div><div class="product-price">1000點</div><button type="button" class="exchange-btn" onclick="exchangeProduct('全家100元卡', 1000)">立即兌換</button></div>
                <div class="product-card">💳<div>全家200元卡</div><div class="product-price">2000點</div><button type="button" class="exchange-btn" onclick="exchangeProduct('全家200元卡', 2000)">立即兌換</button></div>
                <div class="product-card">💳<div>全家500元卡</div><div class="product-price">5000點</div><button type="button" class="exchange-btn" onclick="exchangeProduct('全家500元卡', 5000)">立即兌換</button></div>
                <div class="product-card">💳<div>全家1000元卡</div><div class="product-price">10000點</div><button type="button" class="exchange-btn" onclick="exchangeProduct('全家1000元卡', 10000)">立即兌換</button></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="map.html" class="nav-item"><span>📍</span><span>地圖</span></a>
            <a href="tasks.html" class="nav-item"><span>📋</span><span>任務</span></a>
            <a href="wallet.html" class="nav-item active"><span>💰</span><span>錢包</span></a>
            <a href="profile.html" class="nav-item"><span>👤</span><span>個人</span></a>
        </nav>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/wallet.js"></script>
</body>
</html>
