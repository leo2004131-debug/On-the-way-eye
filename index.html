<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>順路眼 - 登入</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9800">
    <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
    <div class="app-container">
        <div class="login-view">
            <div class="login-header">
                <div class="logo-circle">👁️</div>
                <h1>順路眼</h1>
            </div>
            <form id="login-form" class="login-body">
                <div class="input-field"><label for="login-user" class="sr-only">電子郵件</label><input type="email" id="login-user" placeholder="電子郵件" required></div>
                <div class="input-field"><label for="login-pass" class="sr-only">密碼</label><input type="password" id="login-pass" placeholder="密碼" required></div>
                <button type="submit" class="login-main-btn">進入大廳</button>
                <button type="button" class="login-main-btn" style="background-color: #eee; color: #333;" onclick="handleDevLogin()">開發者登入 (快速測試)</button>
                <div class="login-links">
                    <a href="register.html" class="register-link">註冊帳號</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pwa-install.js"></script>
</body>
</html>
