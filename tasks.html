<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>順路眼 - 任務管理</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <a id="top-left-avatar-btn" href="profile.html" aria-label="個人中心"><span>👤</span></a>
            <h1>任務管理</h1>
        </header>

        <!-- 2.0 任務管理 -->
        <main>
            <div class="task-tabs">
                <button type="button" class="task-tab active" onclick="switchTaskSubTab('posted')">我發布的</button>
                <button type="button" class="task-tab" onclick="switchTaskSubTab('accepted')">我接受的</button>
                <button type="button" class="task-tab" onclick="switchTaskSubTab('review')">回報審核</button>
            </div>
            <div id="sub-posted" class="task-sub-view active"><ul class="task-list" id="my-posted-list"></ul></div>
            <div id="sub-accepted" class="task-sub-view"><div id="my-accepted-list"></div></div>
            <div id="sub-review" class="task-sub-view"></div>
        </main>

        <!-- 互相評價彈窗 -->
        <div id="review-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content" style="text-align: center;">
                <h3 id="review-modal-title" style="margin-top: 0;">給予對方評價</h3>
                <div class="star-row">
                    <span class="star-btn" data-value="1" onclick="setTargetRating(1)">★</span>
                    <span class="star-btn" data-value="2" onclick="setTargetRating(2)">★</span>
                    <span class="star-btn" data-value="3" onclick="setTargetRating(3)">★</span>
                    <span class="star-btn" data-value="4" onclick="setTargetRating(4)">★</span>
                    <span class="star-btn" data-value="5" onclick="setTargetRating(5)">★</span>
                </div>
                <textarea id="review-text" placeholder="寫點評語給對方吧（選填）..."></textarea>
                <div class="review-modal-actions">
                    <button type="button" class="cancel" onclick="closeReviewModal()">取消</button>
                    <button type="button" class="submit" onclick="submitReviewData()">送出評價</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="map.html" class="nav-item"><span>📍</span><span>地圖</span></a>
            <a href="tasks.html" class="nav-item active"><span>📋</span><span>任務</span></a>
            <a href="wallet.html" class="nav-item"><span>💰</span><span>錢包</span></a>
            <a href="profile.html" class="nav-item"><span>👤</span><span>個人</span></a>
        </nav>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
